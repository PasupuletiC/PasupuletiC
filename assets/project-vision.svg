<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img"><title>AI Surveillance</title><style>
.flow{stroke-dasharray:8 10;animation:flow 2s linear infinite}
.orbit{animation:orbit 14s linear infinite;transform-origin:0 0}
.float{animation:float 4s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
.w2{animation-delay:-.3s}.w3{animation-delay:-.7s}.w4{animation-delay:-1s}
.scan{animation:scan 3.5s ease-in-out infinite}
.reel{animation:reel 3s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes wave{50%{transform:scaleY(.3)}}
@keyframes scan{0%,100%{transform:translateY(-58px)}50%{transform:translateY(58px)}}
@keyframes reel{to{transform:translateY(-66px)}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.float,.wave,.scan,.reel,.pulse{animation:none}}
</style><rect x="1" y="1" width="998" height="268" rx="18" fill="#ffffff" stroke="#dce3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="40" fill="#be185d" font-size="15" font-weight="600" letter-spacing="2">PROJECT 03</text><text x="28" y="94" fill="#0f172a" font-size="35" font-weight="700" letter-spacing="-.7">AI Surveillance</text><text x="30" y="137" fill="#475569" font-size="22">Visual detection with context</text><text x="30" y="169" fill="#475569" font-size="22">for incident reporting.</text><text x="30" y="230" fill="#be185d" font-size="17">YOLOv8 · OpenCV · RAG</text></g><g transform="translate(820 135)"><rect x="-94" y="-84" width="188" height="168" rx="16" fill="#fff1f5"/><path d="M-110-50V-96H-64M64-96H110V-50M110 50V96H64M-64 96H-110V50" stroke="#be185d" fill="none" stroke-width="3"/><circle cy="-20" r="23" fill="none" stroke="#be185d" stroke-width="3"/><path d="M-45 49Q-45 10 0 10Q45 10 45 49" stroke="#be185d" stroke-width="3" fill="none"/><g class="scan"><rect x="-94" y="-10" width="188" height="20" fill="#be185d" opacity=".12"/><path d="M-94 0H94" stroke="#be185d" stroke-width="3"/></g></g></svg>
