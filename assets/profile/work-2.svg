<svg xmlns="http://www.w3.org/2000/svg" width="440" height="156" viewBox="0 0 440 156" role="img" aria-label="Ruby: Voice Assistant"><title>Ruby: Voice Assistant</title><rect x=".75" y=".75" width="438.5" height="154.5" rx="16" fill="#eaf2fd" stroke="#c3d9f4" stroke-width="1.5"/><g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="20" y="22" width="40" height="40" rx="11" fill="#fff" stroke="#c3d9f4"/><path d="M30 36h20M30 42h14M30 48h18" stroke="#1f9a73" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-opacity" values="1;.35;1" dur="3.2s" repeatCount="indefinite"/></path><text x="72" y="40" font-size="15.5" fill="#12263f" font-weight="700" text-anchor="start">Ruby: Voice Assistant</text><text x="72" y="62" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">Voice conversations grounded in your</text><text x="72" y="79" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">documents. Persistent memory, retrieval,</text><text x="72" y="96" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">OCR and multilingual voice.</text><rect x="72" y="116" width="54" height="24" rx="7" fill="#fff" stroke="#c3d9f4"/><text x="99" y="132.5" font-size="11.5" fill="#12263f" font-weight="600" text-anchor="middle">Python</text><rect x="132" y="116" width="47" height="24" rx="7" fill="#fff" stroke="#c3d9f4"/><text x="155" y="132.5" font-size="11.5" fill="#12263f" font-weight="600" text-anchor="middle">Flask</text><rect x="185" y="116" width="40" height="24" rx="7" fill="#fff" stroke="#c3d9f4"/><text x="205" y="132.5" font-size="11.5" fill="#12263f" font-weight="600" text-anchor="middle">Groq</text><rect x="231" y="116" width="47" height="24" rx="7" fill="#fff" stroke="#c3d9f4"/><text x="254" y="132.5" font-size="11.5" fill="#12263f" font-weight="600" text-anchor="middle">FAISS</text><path d="M398 36h14m0 0l-4-4m4 4l-4 4" stroke="#12263f" stroke-width="1.8" fill="none" stroke-linecap