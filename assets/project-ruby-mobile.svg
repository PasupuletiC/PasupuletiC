<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img"><title>Ruby Voice Assistant</title><style>
.flow{stroke-dasharray:8 10;animation:flow 2s linear infinite}
.orbit{animation:orbit 14s linear infinite;transform-origin:0 0}
.float{animation:float 4s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
.w2{animation-delay:-.3s}.w3{animation-delay:-.7s}.w4{animation-delay:-1s}
.scan{animation:scan 3.5s ease-in-out infinite}
.reel{animation:reel 3s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes wave{50%{transform:scaleY(.3)}}
@keyframes scan{0%,100%{transform:translateY(-58px)}50%{transform:translateY(58px)}}
@keyframes reel{to{transform:translateY(-66px)}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.float,.wave,.scan,.reel,.pulse{animation:none}}
</style><rect x="1" y="1" width="598" height="338" rx="18" fill="#ffffff" stroke="#dce3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="26" y="40" fill="#0f766e" font-size="18" letter-spacing="2">PROJECT 02</text><text x="24" y="94" fill="#0f172a" font-size="35" font-weight="700" letter-spacing="-.7">Ruby Voice Assistant</text><text x="26" y="141" fill="#475569" font-size="24">Document-grounded conversations</text><text x="26" y="175" fill="#475569" font-size="24">with memory and voice.</text><text x="26" y="278" fill="#0f766e" font-size="22">Explore project ↗</text></g><g transform="translate(460 260) scale(.62)"><circle r="95" fill="#e5f5ef"/><circle r="78" fill="none" stroke="#91cbb8"/><g fill="#0f766e"><rect class="wave w1" x="-81" y="-15" width="12" height="30" rx="6"/><rect class="wave w2" x="-56" y="-30" width="12" height="60" rx="6"/><rect class="wave w3" x="-31" y="-48" width="12" height="96" rx="6"/><rect class="wave w4" x="-6" y="-62.5" width="12" height="125" rx="6"/><rect class="wave w1" x="19" y="-42.5" width="12" height="85" rx="6"/><rect class="wave w2" x="44" y="-26" width="12" height="52" rx="6"/><rect class="wave w3" x="69" y="-12.5" width="12" height="25" rx="6"/></g></g></svg>
