<text class="l" x="120.0" y="141">Camera Feed</text><text class="sl" x="120.0" y="161">video stream</text>
<path class="flow" d="M198 145 L232 145"/>
<rect class="box" x="235" y="110" width="150" height="70" rx="10"/>
<text class="l" x="310.0" y="141">YOLOv8 Detector</text><text class="sl" x="310.0" y="161">object detection</text>
<path class="flow" d="M388 145 L422 145"/>
<rect class="box" x="425" y="110" width="150" height="70" rx="10"/>
<text class="l" x="500.0" y="141">Event Logic</text><text class="sl" x="500.0" y="161">detections → events</text>
<path class="flow" d="M578 145 L612 145"/>
