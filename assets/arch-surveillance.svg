<path class="flow" d="M768 145 L802 145"/>
<rect class="box" x="805" y="110" width="150" height="70" rx="10"/>
<text class="l" x="880.0" y="141">Incident Report</text><text class="sl" x="880.0" y="161">alerts &amp; summaries</text>
