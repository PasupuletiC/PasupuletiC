<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bg{fill:#ffffff;stroke:#dce3ed} .t{fill:#0f172a;font-size:20px;font-weight:600}
.box{fill:#f1f5f9;stroke:#4338ca;stroke-width:1.5} .l{fill:#0f172a;font-size:14px;font-weight:600;text-anchor:middle}
.sl{fill:#475569;font-size:11.5px;text-anchor:middle} .f{fill:#475569;font-size:12.5px}
.flow{stroke:#4338ca;stroke-width:2;stroke-dasharray:6 6;fill:none;animation:d 1s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}</style>
