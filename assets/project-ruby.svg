<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>Ruby Voice Assistant</title><defs><radialGradient id="glow"><stop stop-color="#433077" stop-opacity=".65"/><stop offset="1" stop-color="#101220" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/></pattern></defs><rect width="1000" height="300" rx="20" fill="#101220"/><rect width="1000" height="300" rx="20" fill="url(#dots)"/><ellipse cx="800" cy="130" rx="350" ry="250" fill="url(#glow)"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="30" width="4" height="240" rx="2" fill="#67e8f9"/><text x="40" y="48" fill="#67e8f9" font-size="16" font-weight="600" letter-spacing="2">02 / CONVERSATIONAL AI</text><text x="38" y="105" fill="#f5f3ff" font-size="38" font-weight="700" letter-spacing="-1">Ruby Voice Assistant</text><text x="40" y="153" fill="#c5c5d8" font-size="24">Your documents. Your context.</text><text x="40" y="185" fill="#c5c5d8" font-size="24">A conversation away.</text><text x="40" y="244" fill="#67e8f9" font-size="14" letter-spacing="1">PYTHON / FLASK / GROQ / FAISS</text><text x="40" y="277" fill="#9a9bb5" font-size="16">Explore repository ↗</text><circle cx="812" cy="150" r="94" fill="none" stroke="#67e8f9" opacity=".16"/><circle cx="812" cy="150" r="70" fill="none" stroke="#67e8f9" opacity=".25"/><g stroke="#67e8f9" stroke-width="8" stroke-linecap="round"><path class="wave w0" d="M752 138v24"/><path class="wave w1" d="M772 126v48"/><path class="wave w2" d="M792 111v78"/><path class="wave w3" d="M812 95v110"/><path class="wave w4" d="M832 117v66"/><path class="wave w5" d="M852 130v40"/><path class="wave w6" d="M872 141v18"/></g><style>.wave{animation:pulse 2.5s ease-in-out infinite;transform-origin:812px 150px}.w1,.w5{animation-delay:.2s}.w2,.w4{animation-delay:.4s}.w3{animation-delay:.6s}@keyframes pulse{50%{opacity:.45;transform:scaleY(.65)}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style></g></svg>
