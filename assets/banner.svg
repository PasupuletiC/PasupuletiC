<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#16213a"/></linearGradient>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<style>
.n{fill:#fff;font-size:44px;font-weight:700;animation:in 1.2s ease-out both}
.r{fill:#9fb3c8;font-size:20px;animation:in 1.2s .4s ease-out both}
.s{fill:#6b7f95;font-size:14px;animation:in 1.2s .8s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{animation:w 2s .3s ease-out both} @keyframes w{from{width:0}to{width:120px}}
.p{fill:#3b82f6;opacity:.5;animation:f 4s ease-in-out infinite} .p2{animation-delay:1.3s} .p3{animation-delay:2.4s}
@keyframes f{50%{transform:translateY(-14px);opacity:.15}}
</style>
<rect width="1000" height="220" rx="14" fill="url(#g)"/>
<circle class="p" cx="860" cy="60" r="5"/><circle class="p p2" cx="910" cy="130" r="4"/><circle class="p p3" cx="810" cy="150" r="6"/>
<text class="n" x="50" y="92">Charan Kumar Pasupuleti</text>
<rect class="bar" x="50" y="108" height="4" rx="2" fill="url(#a)"/>
<text class="r" x="50" y="148">AI / ML Engineer · RAG · Agentic AI · Computer Vision</text>
<text class="s" x="50" y="180">Building production-minded LLM applications · Hyderabad, India</text>
</svg>