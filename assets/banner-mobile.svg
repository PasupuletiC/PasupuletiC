<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img"><title>Charan Kumar Pasupuleti — animated AI engineer profile</title><style>
.flow{stroke-dasharray:8 10;animation:flow 2s linear infinite}
.orbit{animation:orbit 14s linear infinite;transform-origin:0 0}
.float{animation:float 4s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
.w2{animation-delay:-.3s}.w3{animation-delay:-.7s}.w4{animation-delay:-1s}
.scan{animation:scan 3.5s ease-in-out infinite}
.reel{animation:reel 3s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes wave{50%{transform:scaleY(.3)}}
@keyframes scan{0%,100%{transform:translateY(-58px)}50%{transform:translateY(58px)}}
@keyframes reel{to{transform:translateY(-66px)}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.float,.wave,.scan,.reel,.pulse{animation:none}}
</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient><linearGradient id="ink"><stop stop-color="#4338ca"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect x="1" y="1" width="598" height="518" rx="20" fill="url(#bg)" stroke="#dce3ed"/><g font-family="Arial,Helvetica,sans-serif"><circle cx="31" cy="35" r="5" fill="#0f766e" class="pulse"/><text x="46" y="42" font-size="18" fill="#526075" letter-spacing="2">BUILDING WITH AI</text><text x="24" y="110" fill="#0f172a" font-size="53" font-weight="800" letter-spacing="-2">Charan Kumar</text><text x="28" y="155" fill="#4338ca" font-size="33" font-weight="600">Pasupuleti</text><text x="28" y="199" fill="#475569" font-size="25">AI / ML Engineer</text><text x="28" y="238" fill="#526075" font-size="21">Agents / RAG / Computer vision</text><text x="300" y="490" text-anchor="middle" fill="#0f766e" font-size="21">Open to AI / ML opportunities</text></g><g transform="translate(300 355) scale(.75)"><circle r="120" fill="#e0e7ff"/><circle r="94" fill="#f8faff"/><g fill="none" stroke="#a5b4fc"><circle r="120"/><ellipse rx="120" ry="44" transform="rotate(-30)"/><ellipse rx="120" ry="44" transform="rotate(30)"/></g><g class="orbit"><circle cx="120" r="9" fill="#4338ca"/><circle cx="-120" r="7" fill="#0f766e"/><circle cy="-120" r="5" fill="#be185d"/></g><g class="float"><rect x="-48" y="-39" width="96" height="78" rx="22" fill="#4338ca"/><text y="11" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">AI</text></g></g><path class="flow" d="M45 355H195M405 355H555" stroke="#0f766e" fill="none" stroke-width="3"/></svg>
