<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img"><title>AI Operations Center</title><style>
.flow{stroke-dasharray:8 10;animation:flow 2s linear infinite}
.orbit{animation:orbit 14s linear infinite;transform-origin:0 0}
.float{animation:float 4s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:center;animation:wave 1.4s ease-in-out infinite}
.w2{animation-delay:-.3s}.w3{animation-delay:-.7s}.w4{animation-delay:-1s}
.scan{animation:scan 3.5s ease-in-out infinite}
.reel{animation:reel 3s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-72}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes wave{50%{transform:scaleY(.3)}}
@keyframes scan{0%,100%{transform:translateY(-58px)}50%{transform:translateY(58px)}}
@keyframes reel{to{transform:translateY(-66px)}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.float,.wave,.scan,.reel,.pulse{animation:none}}
</style><rect x="1" y="1" width="998" height="268" rx="18" fill="#ffffff" stroke="#dce3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="40" fill="#4338ca" font-size="15" font-weight="600" letter-spacing="2">PROJECT 01</text><text x="28" y="94" fill="#0f172a" font-size="35" font-weight="700" letter-spacing="-.7">AI Operations Center</text><text x="30" y="137" fill="#475569" font-size="22">Support email triage, retrieval,</text><text x="30" y="169" fill="#475569" font-size="22">and incident analysis.</text><text x="30" y="230" fill="#4338ca" font-size="17">LangGraph · FastAPI · Next.js · Qdrant</text></g><g transform="translate(820 135)"><path class="flow" d="M-84-52L0 0L84-52M-84 52L0 0L84 52" fill="none" stroke="#4338ca" stroke-width="3"/><g fill="#eef2ff" stroke="#a5b4fc"><rect x="-112" y="-75" width="62" height="46" rx="10"/><rect x="-112" y="29" width="62" height="46" rx="10"/><rect x="50" y="-75" width="62" height="46" rx="10"/><rect x="50" y="29" width="62" height="46" rx="10"/></g><circle r="35" fill="#4338ca"/><g fill="#4338ca" font-family="Arial" font-size="13" text-anchor="middle"><text x="-81" y="-48">MAIL</text><text x="-81" y="57">RAG</text><text x="81" y="-48">PLAN</text><text x="81" y="57">ACT</text></g><text y="6" text-anchor="middle" fill="white" font-family="Arial" font-size="17">AGENT</text><circle r="43" fill="none" stroke="#4338ca" class="pulse"/></g></svg>
