name: Refresh profile cards
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_profile.py'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/generate_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Refresh profile cards'
          git pull --rebase origin main
          git push origin HEAD:main
