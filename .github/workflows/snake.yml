name: Generate contribution snake
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_dots=#ebedf0,#fde9c4,#fbd38d,#f6ad55,#b45309&color_snake=#be185d
            dist/snake-dark.svg?palette=github-dark&color_dots=#161b22,#5a3a10,#8f5b14,#c98a1d,#f5b84b&color_snake=#ff8fa3
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
