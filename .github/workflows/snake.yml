name: Generate contribution snake
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_dots=#ebedf0,#c6ecd9,#8fd6b4,#4fba8d,#1f9a73&color_snake=#0f766e
            dist/snake-dark.svg?palette=github-dark&color_dots=#161b22,#0f4a3a,#1a7a5a,#25a07a,#34d399&color_snake=#60a5fa
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
