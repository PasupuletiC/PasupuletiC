name: Generate contribution snake
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_dots=#ebedf0,#c7d2fe,#93a8f8,#5a7bf0,#1d4ed8&color_snake=#6149b9
            dist/snake-dark.svg?palette=github-dark&color_dots=#161b22,#2a3a78,#3f5bb8,#5f82f0,#7aa2ff&color_snake=#aa91ff
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
