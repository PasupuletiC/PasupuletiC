name: Refresh profile dashboard
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-dashboard.ps1'
      - '.github/workflows/dashboard.yml'
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate dashboard from GitHub API
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-dashboard.ps1
      - name: Commit updated metrics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-dark.svg assets/activity-light.svg
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Refresh GitHub profile metrics'
          git pull --rebase origin main
          git push origin HEAD:main
